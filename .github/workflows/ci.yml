name: CI

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  askr-peer:
    name: Askr peer (${{ matrix.askr-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        askr-version: ['0.2.0', latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Select Askr peer version
        run: npm install --no-save @askrjs/askr@${{ matrix.askr-version }}

      - name: Install Chromium with Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Test Monaco lifecycle compatibility
        run: |
          npm run test:jsdom
          npx vitest run --config vitest.test.browser.config.ts --browser.name=chromium tests/browser/components/monaco-editor/integration.test.tsx

  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Install browser engines with Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install browser engines
        if: ${{ runner.os != 'Linux' }}
        run: npx playwright install chromium firefox webkit

      - name: Format check
        run: npm run fmt --if-present -- --check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Type checks
        run: |
          npm run typecheck --if-present
          npm run test:types --if-present
